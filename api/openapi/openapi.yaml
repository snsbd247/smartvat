openapi: 3.1.0
info:
  title: Universal Business ERP API
  description: >
    REST API for the multi-company Universal Business ERP (Manufacturing /
    Service / Trading + hybrids), Bangladesh VAT/Mushak/VDS. This document grows
    one module at a time; Phase 1 covers only the foundation endpoints.
  version: 0.1.0-dev
servers:
  - url: /api
    description: Same-origin API (served behind Nginx in production)
tags:
  - name: System
    description: Health and readiness
  - name: Auth
    description: Authentication (Sanctum)
  - name: Organization
    description: Companies, factories, warehouses (tenant-scoped)
  - name: MasterData
    description: Products, categories, units
  - name: Inventory
    description: Stock operations and reports (requires the inventory module)
  - name: Purchase
    description: Suppliers and local procure-to-pay (PO, GRN, invoice, payment)
  - name: Import
    description: Import shipments and landed-cost allocation
  - name: Sales
    description: Customers and local/export order-to-cash
paths:
  /health:
    get:
      tags: [System]
      summary: Health / readiness probe
      description: Public. Reports app status and database connectivity.
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service degraded (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate by email or username; returns a Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, description: email or username }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200': { description: Token, user, and accessible companies }
        '422': { description: Invalid or inactive credentials }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Logged out }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user with roles/permissions for the active company
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyHeader'
      responses:
        '200': { description: The authenticated user }
        '401': { description: Unauthenticated }
        '403': { description: No/unauthorized company }
  /companies:
    get:
      tags: [Organization]
      summary: Companies the authenticated user may access (company switcher)
      security: [{ sanctum: [] }]
      responses:
        '200': { description: List of companies }
  /company/modules:
    get:
      tags: [Organization]
      summary: Enabled module keys for the active company (sidebar manifest)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '200': { description: '{ modules: string[] }' }
  /company/config:
    get:
      tags: [Organization]
      summary: Business types + per-module enabled state
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '200': { description: Company configuration }
    put:
      tags: [Organization]
      summary: Reconfigure business types / industry template and re-derive modules
      description: Requires the company.configure permission.
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_types]
              properties:
                business_types:
                  type: array
                  items: { type: string, enum: [manufacturing, service, trading] }
                primary_business_type: { type: string, enum: [manufacturing, service, trading] }
                industry_template: { type: string }
      responses:
        '200': { description: Updated configuration }
        '403': { description: Missing company.configure permission }
        '422': { description: Validation error }
  /warehouses:
    get:
      tags: [Organization]
      summary: List warehouses (current company; requires the inventory module)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '200': { description: Paginated warehouses }
        '403': { description: Inventory module not enabled, or missing warehouse.view }
  /factories:
    get:
      tags: [Organization]
      summary: List factories (current company only)
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyHeader'
      responses:
        '200': { description: Paginated factories }
        '403': { description: Missing factory.view permission or company access }
    post:
      tags: [Organization]
      summary: Create a factory in the current company
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 32 }
                name: { type: string }
                address: { type: string, nullable: true }
                status: { type: string, enum: [active, inactive] }
      responses:
        '201': { description: Created factory }
        '403': { description: Missing factory.create permission }
        '422': { description: Validation error (e.g. duplicate code within company) }
  /products:
    get:
      tags: [MasterData]
      summary: List products (current company)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '200': { description: Paginated products }
    post:
      tags: [MasterData]
      summary: Create a product
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                type: { type: string, enum: [raw, finished, packaging, consumable, spare, service] }
                costing_method: { type: string, enum: [weighted_average, fifo] }
      responses:
        '201': { description: Created product }
        '403': { description: Missing product.create }
  /inventory/receipts:
    post:
      tags: [Inventory]
      summary: Goods receipt (Dr Inventory / Cr GRN clearing)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, lines]
              properties:
                warehouse_id: { type: integer }
                date: { type: string, format: date }
                lines:
                  type: array
                  items:
                    type: object
                    required: [product_id, qty, unit_cost]
                    properties:
                      product_id: { type: integer }
                      qty: { type: number }
                      unit_cost: { type: number }
      responses:
        '201': { description: Inventory transaction created }
        '403': { description: Inventory module disabled or missing inventory.operate }
  /inventory/issues:
    post:
      tags: [Inventory]
      summary: Material issue at weighted-average cost (Dr COGS / Cr Inventory)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '201': { description: Inventory transaction created }
  /inventory/transfers:
    post:
      tags: [Inventory]
      summary: Warehouse-to-warehouse transfer (no GL impact)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '201': { description: Inventory transaction created }
  /inventory/adjustments:
    post:
      tags: [Inventory]
      summary: Stock adjustment (net value vs inventory-adjustment account)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '201': { description: Inventory transaction created }
  /inventory/stock:
    get:
      tags: [Inventory]
      summary: Company-owned stock valuation
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '200': { description: Valuation rows }
  /inventory/reconciliation:
    get:
      tags: [Inventory]
      summary: Inventory-to-GL reconciliation (stock value vs Inventory account)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses:
        '200':
          description: '{ stock_value_total, inventory_gl_balance, difference, in_balance }'
  /suppliers:
    get:
      tags: [Purchase]
      summary: List suppliers
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '200': { description: Paginated suppliers } }
    post:
      tags: [Purchase]
      summary: Create a supplier
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Created }, '403': { description: Missing supplier.create } }
  /goods-receipts:
    post:
      tags: [Purchase]
      summary: Goods receipt — stock in + Dr Inventory / Cr GRN-clearing
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: GRN created }, '403': { description: Missing purchase.manage } }
  /purchase-invoices:
    post:
      tags: [Purchase]
      summary: Purchase invoice (material clears GRN-clearing to AP; service debits expense)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Invoice posted } }
  /supplier-payments:
    post:
      tags: [Purchase]
      summary: Supplier payment — Dr AP / Cr Cash|Bank
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Payment posted } }
  /suppliers/{supplier}/ledger:
    get:
      tags: [Purchase]
      summary: Supplier ledger + outstanding balance
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyHeader'
        - { name: supplier, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: '{ outstanding, entries[] }' } }
  /import-shipments:
    post:
      tags: [Import]
      summary: Create an import shipment (FC lines + charges)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Shipment created } }
  /import-shipments/{importShipment}/landed-cost:
    get:
      tags: [Import]
      summary: Preview landed-cost allocation (no posting)
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyHeader'
        - { name: importShipment, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: 'Per-line landed cost + totals' } }
  /import-shipments/{importShipment}/receive:
    post:
      tags: [Import]
      summary: Receive at landed cost (stock in + GL)
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyHeader'
        - { name: importShipment, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: Shipment received } }
  /customers:
    get:
      tags: [Sales]
      summary: List customers
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '200': { description: Paginated customers } }
    post:
      tags: [Sales]
      summary: Create a customer
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Created } }
  /sales-invoices:
    post:
      tags: [Sales]
      summary: Sales invoice (local or export) — Dr AR / Cr Revenue
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, lines]
              properties:
                customer_id: { type: integer }
                kind: { type: string, enum: [local, export] }
                currency: { type: string }
                exchange_rate: { type: number }
                lines:
                  type: array
                  items:
                    type: object
                    required: [line_total]
                    properties:
                      product_id: { type: integer }
                      qty: { type: number }
                      unit_price: { type: number }
                      line_total: { type: number }
      responses: { '201': { description: Invoice posted } }
  /delivery-challans:
    post:
      tags: [Sales]
      summary: Delivery challan (separate from invoice) — stock out + COGS
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Challan posted } }
  /customer-receipts:
    post:
      tags: [Sales]
      summary: Customer receipt (export books exchange gain/loss)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Receipt posted } }
  /sales-returns:
    post:
      tags: [Sales]
      summary: Sales return + credit note (goods back + Dr Revenue / Cr AR)
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyHeader' }]
      responses: { '201': { description: Return posted } }
  /customers/{customer}/ledger:
    get:
      tags: [Sales]
      summary: Customer ledger + outstanding balance
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyHeader'
        - { name: customer, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: '{ outstanding, entries[] }' } }
components:
  parameters:
    CompanyHeader:
      name: X-Company-Id
      in: header
      required: false
      schema: { type: integer }
      description: >
        Active company (tenant). Defaults to the user's default company. The user
        must have access to it or the request is rejected with 403.
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Laravel Sanctum token (or same-site cookie session for the SPA)
  schemas:
    Health:
      type: object
      required: [status, app, version, environment, time, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        app:
          type: string
        version:
          type: string
        environment:
          type: string
        time:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, unavailable]
