# PLASTEX ERP — Nginx site. SPA + Laravel API served from Laravel's public dir.
server {
    listen 80;
    server_name your-domain.example;   # or the server IP
    root /var/www/plastex/backend/public;
    index index.php;

    # Security headers (app also sets these; belt-and-braces)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Never serve dotfiles (.env etc.) or the storage/backup dirs.
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/plastex_access.log;
    error_log  /var/log/nginx/plastex_error.log;
}
